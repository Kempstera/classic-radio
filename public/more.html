      if(!hit.length)return;
      rn+=hit.length;
      block+='<div class="country"><h3>'+esc(lang==="zh"?co.cz:co.ce)+'<i>'+hit.length+'</i></h3><div class="grid">'+
        hit.map(function(s){return cardHTML(s,idxMap[s.u])}).join("")+'</div></div>';
    });
    if(!rn)return;
    total+=rn;
    h+='<section class="group"><div class="group-head"><h2>'+esc(lang==="zh"?REGCN[rk]:REGEN[rk])+'</h2>'+
       '<span class="gcount">'+rn+' '+esc(t("st"))+'</span><span class="rule"></span></div>'+block+'</section>';
  });
  body.innerHTML=h;
  empty.classList.toggle("on",total===0);
  empty.textContent=t("none");
  if(cur)markActive(cur.u);
}

function byUrl(u){for(var i=0;i<DATA.length;i++)if(DATA[i].u===u)return DATA[i];return null}
function cards(){return body.querySelectorAll(".card")}
function markActive(u){[].forEach.call(cards(),function(c){c.classList.toggle("active",c.dataset.u===u)})}
function setStat(html,err){pstat.className="pstat"+(err?" err":"");pstat.innerHTML=html}

function stopAll(){
  try{audio.pause()}catch(e){}
  if(hls){try{hls.destroy()}catch(e){}hls=null}
  audio.removeAttribute("src");try{audio.load()}catch(e){}
  pmain.textContent="▶";markActive(null);
}
function play(s){
  if(cur&&cur.u===s.u){toggle();return}
  stopAll();loading=true;cur=s;
  player.classList.add("up");
  pmark.textContent=mono(s.n);pname.textContent=s.n;
  setStat('<span class="live"></span>'+esc(t("conn")));
  pmain.disabled=false;pmain.textContent="Ⅱ";
  markActive(s.u);localStorage.setItem("cr.last",s.u);
  var url=s.u;
  function ready(){loading=false;setStat('<span class="live"></span>LIVE');
    if("mediaSession" in navigator){try{navigator.mediaSession.metadata=new MediaMetadata(
      {title:s.n,artist:(lang==="zh"?s.cz:s.c)||"Classical Radio",album:"Classic Radio"})}catch(e){}}}
  function fail(msg){loading=false;pmain.textContent="▶";markActive(null);
    setStat(msg||t("fail"),true);
    say('<b>'+esc(s.n)+'</b> — '+esc(msg||t("fail")),9000)}
  var canJs=(typeof Hls!=="undefined"&&Hls.isSupported());
  if(/\.m3u8(\?|$)/i.test(url)&&canJs){
    hls=new Hls({enableWorker:true,liveSyncDurationCount:3,manifestLoadingTimeOut:15000,
      manifestLoadingMaxRetry:3,fragLoadingMaxRetry:5,xhrSetup:function(x){x.withCredentials=false}});
    hls.loadSource(url);hls.attachMedia(audio);
    hls.on(Hls.Events.MANIFEST_PARSED,function(){kick()});
    hls.on(Hls.Events.ERROR,function(e,d){
      if(!d||!d.fatal)return;
      if(d.type===Hls.ErrorTypes.NETWORK_ERROR){
        if(d.details===Hls.ErrorDetails.MANIFEST_LOAD_ERROR||d.details===Hls.ErrorDetails.MANIFEST_LOAD_TIMEOUT){
          fail(lang==="zh"?"网络或地区限制导致无法获取直播源。":"Network or regional restriction blocked the stream.");
        } else {try{hls.startLoad()}catch(x){fail()}}
      } else if(d.type===Hls.ErrorTypes.MEDIA_ERROR){try{hls.recoverMediaError()}catch(x){fail()}}
      else fail();
    });
  } else {audio.src=url;kick()}
  function kick(){
    var p=audio.play();
    if(p&&p.then){p.then(function(){ready()}).catch(function(err){
      if(err&&err.name==="NotAllowedError"){loading=false;setStat(t("ready"))}
      else fail()})}
    else ready();
  }
}
function toggle(){
  if(!cur||loading)return;
  if(audio.paused){pmain.textContent="Ⅱ";var p=audio.play();if(p&&p.then)p.catch(function(){})}
  else{audio.pause()}
}
function closeBar(){
  stopAll();cur=null;player.classList.remove("up");
  pname.textContent=lang==="zh"?"此刻，留一点空白":"Nothing playing";
  setStat(t("choose"));
  if("mediaSession" in navigator){try{navigator.mediaSession.metadata=null}catch(e){}}
}
var tt=null;
function say(html,ms){toast.innerHTML=html;toast.classList.add("on");
  clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove("on")},ms||7000)}

audio.addEventListener("playing",function(){loading=false;pmain.textContent="Ⅱ";if(cur){markActive(cur.u);setStat('<span class="live"></span>LIVE')}});
audio.addEventListener("pause",function(){if(!cur||loading)return;pmain.textContent="▶";setStat(t("paused"))});
audio.addEventListener("waiting",function(){if(cur)setStat(t("buf"))});
audio.addEventListener("error",function(){if(!cur||!audio.src)return;loading=false;pmain.textContent="▶";markActive(null);setStat(t("fail"),true)});

document.addEventListener("click",function(e){
  var chip=e.target.closest(".chip");
  if(chip){filter.reg=chip.dataset.reg;
    [].forEach.call(chips.querySelectorAll(".chip"),function(c){c.setAttribute("aria-pressed",String(c===chip))});
    render();return}
  var card=e.target.closest(".card");
  if(card){var s=byUrl(card.dataset.u);if(s)play(s)}
});
pmain.addEventListener("click",toggle);
pclose.addEventListener("click",closeBar);
vol.addEventListener("input",function(){audio.volume=parseFloat(this.value);localStorage.setItem("cr.vol",this.value)});

function setLang(l){
  lang=l;localStorage.setItem("cr.lang",l);
  document.documentElement.lang=(l==="zh"?"zh-CN":"en");
  [].forEach.call(document.querySelectorAll("#lang button"),function(b){b.classList.toggle("on",b.dataset.l===l)});
  $("home").textContent=t("home");
  $("eyebrow").textContent=t("eyebrow");
  $("h1").innerHTML=t("h1");
  $("intro").textContent=t("intro");
  $("f1").textContent=t("f1");$("f2").textContent=t("f2");
  $("q").placeholder=t("ph");
  document.querySelector(".vol span").textContent=t("vol");
  $("meta").textContent=lang==="zh"
    ? TOTAL+" 座电台 · "+NCOUNTRY+" 个国家 · "+REGORDER.filter(function(k){return GROUPS[k]}).length+" 个地区"
    : TOTAL+" stations · "+NCOUNTRY+" countries · "+REGORDER.filter(function(k){return GROUPS[k]}).length+" regions";
  buildChips();render();
  if(cur){pname.textContent=cur.n}else if(!player.classList.contains("up")){setStat(t("choose"))}
}
$("q").addEventListener("input",function(){filter.q=this.value.trim();render()});
[].forEach.call(document.querySelectorAll("#lang button"),function(b){
  b.addEventListener("click",function(){setLang(b.dataset.l)})});

vol.value=localStorage.getItem("cr.vol")||"0.8";audio.volume=parseFloat(vol.value);
$("q").placeholder=T[lang].ph;
setLang(lang);
var last=localStorage.getItem("cr.last");
if(last&&byUrl(last)){var s=byUrl(last);cur=s;player.classList.add("up");pmark.textContent=mono(s.n);
  pname.textContent=s.n;pmain.disabled=false;setStat(lang==="zh"?"上次收听 · 点击播放键继续":"Last played · press play to resume");
  markActive(s.u)}
})();
</script>
</body></html>
